name: Part 1 Documentation Check

on:
  push:
  pull_request:

jobs:
  validate-part1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder exists
        run: test -d docs

      - name: Check ERD is present (PNG or PDF)
        run: test -f docs/RaceDay_ERD.png || test -f docs/RaceDay_ERD.pdf

      - name: Check API Endpoint Plan
        run: test -f docs/RaceDay_API_Endpoint_Plan.pdf

      - name: Check SQL Database Script
        run: test -f docs/RaceDay_Database.sql

      - name: Check README
        run: test -f README.md

